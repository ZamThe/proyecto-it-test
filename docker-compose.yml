services:
  mariadb:
    image: mariadb:11
    container_name: pressbooks-db
    restart: unless-stopped

    env_file:
      - .env

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - mariadb_data:/var/lib/mysql

    networks:
      - pressbooks-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: pressbooks-phpmyadmin
    restart: unless-stopped

    depends_on:
      - mariadb

    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306

    ports:
      - "8081:80"

    networks:
      - pressbooks-network

volumes:
  mariadb_data:

networks:
  pressbooks-network: