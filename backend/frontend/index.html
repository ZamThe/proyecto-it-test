<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        GitHub añade usuarios por CRUD
    </title>

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link 
        rel="stylesheet"
        href="css/styles.css"  >
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">
             GitHub buscador
        </a>
    </div>
</nav>
<div class="container mt-5">

    <div id="alert"></div>

    <div class="row g-4">
        <div class="col-md-6">
            <div class="card card-dashboard p-4">
                <h4>
                Sincronizar Usuarios GitHub
                </h4>
                <p class="text-muted">
                    Consulta la API externa de GitHub y almacena la información.
                </p>
                <div class="input-group">
                    <input id="username" type="text" class="form-control" placeholder="Ejemplo: octocat">
                    <button class="btn btn-primary" onclick="syncUser()">Sincronizar </button>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card card-dashboard p-4">
                <h4>  Buscar usuario</h4> <p class="text-muted"> Consulta un usuario almacenado por su ID interno.</p>
                <div class="input-group">
                    <input id="userId"type="number" class="form-control" placeholder="ID del usuario">
                    <button class="btn btn-success"onclick="getUserById()">Buscar</button>
                </div>
                <div 
                    id="searchResult"
                    class="mt-3"
                ></div>
            </div>
        </div>
    </div>

    <div class="table-container mt-5">
        <div class="d-flex justify-content-between align-items-center">
            <h3>Usuarios sincronizados</h3>
            <button class="btn btn-dark"onclick="loadUsers()">
                Actualizar
            </button>
        </div>
        <div class="table-responsive">
            <table class="table table-hover mt-4">

                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Avatar</th>
                        <th>Login </th>
                        <th>Nombre</th>
                        <th>Repositorio </th>
                        <th>Seguidores </th>
                        <th> Acciones </th>
                    </tr>
                </thead>
                <tbody id="usersTable">
                </tbody>

            </table>
        </div>

    </div>
</div>

<script src="js/app.js"></script>

</body>

</html>
